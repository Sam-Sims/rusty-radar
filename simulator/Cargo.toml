[package]
name = "rusty-radar-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.8.0"
rand = { version = "0.9.5", default-features = false, features = ["os_rng", "small_rng"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
rusty-radar-graphics = { path = "../graphics" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
